{# Reusable miniature custom space icons. Extend as needed. #}
{% if key == "planet" or key == "ringed-planet" %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="mini-icon"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="9" ry="3.2" transform="rotate(-20 12 12)"/></svg>
{% elif key == "constellation" %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="mini-icon"><circle cx="5" cy="5" r="1.5"/><circle cx="19" cy="7" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="17" cy="17" r="1.5"/><path d="M6 6l12 10"/></svg>
{% elif key == "rocket" %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="mini-icon"><path d="M12 3l7 7-7 11-7-11 7-7z"/><path d="M12 21v-3"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/></svg>
{% else %}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="mini-icon"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>
{% endif %}
